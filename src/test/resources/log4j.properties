# Suppress Apache HttpClient debug logs
#log4j.logger.org.apache.http=ERROR
#log4j.logger.org.apache.http.headers=ERROR
## Optionally, suppress all RestAssured logs
#log4j.logger.io.restassured=ERROR


<?xml version="1.0" encoding="UTF-8"?>
<Configuration status="WARN">
<Loggers>

<Logger=name="org.apache.http.impl.conn" level="warn" additivity="false"/>
<Root level="info">
<AppenderRef ref="Console"/>
</Root>

</Loggers>
</Configuration>
